<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>productivity_shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="popup">

  <header class="header">
    <div class="header-logo">
      <img src="../icons/icon32.png" alt="">
      productivity_shield
    </div>
    <button class="btn btn-ghost btn-icon" id="settingsBtn" title="Réglages">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- Profile bar -->
  <div class="profile-bar">
    <button class="profile-btn" data-profile="normal">Normal</button>
    <button class="profile-btn" data-profile="focus">Focus</button>
    <button class="profile-btn" data-profile="zen">Zen</button>
  </div>

  <!-- Status card -->
  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Créneau</span>
      <span class="status-value" id="slotStatus">—</span>
    </div>
    <div class="status-row">
      <span class="status-label">Pause</span>
      <span class="status-value" id="pauseStatus">—</span>
    </div>
  </div>

  <!-- Current site banner -->
  <div class="site-banner" id="siteBanner" style="display:none">
    <span id="siteDomain"></span>
    <span class="site-status" id="siteStatus"></span>
  </div>

  <!-- Quick actions -->
  <div class="actions" id="quickActions" style="display:none">
    <button class="btn btn-secondary btn-flex" id="whitelistBtn">Whitelist ce site</button>
    <button class="btn btn-secondary btn-flex" id="blacklistBtn">Blacklist ce site</button>
  </div>

  <footer class="footer">
    <span class="footer-version">v1.0.0</span>
  </footer>

</div>

<div class="toast" id="toast"></div>
<script src="popup.js"></script>
</body>
</html>
