name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> $GITHUB_OUTPUT

      - name: Build zip
        run: |
          zip -r productivity-shield.zip \
            background \
            content \
            icons \
            manifest.json \
            pages \
            popup \
            shared \
            LICENSE \
            README.md

      - name: Delete existing latest release
        run: gh release delete latest --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing latest tag
        run: git push origin :refs/tags/latest || true

      - name: Create rolling latest release
        run: |
          gh release create latest productivity-shield.zip \
            --title "productivity_shield v${{ steps.version.outputs.version }}" \
            --notes "Latest build from \`main\` — v${{ steps.version.outputs.version }}. Download the zip, unzip it, then load it in Chrome via \`chrome://extensions\` → **Load unpacked**." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
